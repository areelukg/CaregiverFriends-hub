function changeLang(lang, btn) {
  currentLang = lang;
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');

  const t = uiText[lang];
  document.getElementById('ui-title').innerText = t.title;
  document.getElementById('ui-subtitle').innerText = t.subtitle;
  document.getElementById('ui-guideline-box').innerHTML = t.guideline;
  document.getElementById('searchInput').placeholder = t.searchPlaceholder;
  document.getElementById('btn-all').innerText = t.btnAll;
  document.getElementById('btn-green').innerText = t.btnGreen;
  document.getElementById('btn-yellow').innerText = t.btnYellow;
  document.getElementById('btn-red').innerText = t.btnRed;
  document.getElementById('ui-ref-note').innerText = t.refNote;
  document.getElementById('ui-disclaimer-box').innerHTML = t.disclaimer;
  document.getElementById('ui-license-box').innerHTML = t.licenseBox;

  filterFoods();
}

function setZone(zone, btn) {
  currentZone = zone;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  filterFoods();
}

function filterFoods() {
  const query = document.getElementById('searchInput').value.toLowerCase().trim();
  const list = document.getElementById('foodList');
  list.innerHTML = '';

  const t = uiText[currentLang];

  const filtered = foodDatabase.filter(item => {
    const matchZone = (currentZone === 'all') || (item.zone === currentZone);
    const nameMatch = item.name.th.toLowerCase().includes(query) || 
                      item.name.en.toLowerCase().includes(query) || 
                      item.name.zh.toLowerCase().includes(query);
    const reasonMatch = item.reason[currentLang].toLowerCase().includes(query);
    return matchZone && (nameMatch || reasonMatch);
  });

  document.getElementById('resultCount').innerText = t.countText.replace('{n}', filtered.length);

  if (filtered.length === 0) {
    list.innerHTML = `<div class="no-result">${t.noResult}</div>`;
    return;
  }

  filtered.forEach(item => {
    const card = document.createElement('div');
    card.className = `food-card ${item.zone}`;
    card.innerHTML = `
      <div class="card-top">
        <div class="food-name">${item.name[currentLang]}</div>
        <div class="food-tag">${item.zoneText[currentLang]}</div>
      </div>
      <div class="info-row">
        <span class="info-label">${t.portionPrefix}</span>
        <span>${item.portion[currentLang]}</span>
        <span class="vit-k-val">${t.vitKPrefix}${item.vitK}</span>
      </div>
      <div class="reason"><strong>${t.reasonPrefix}</strong>${item.reason[currentLang]}</div>
    `;
    list.appendChild(card);
  });
}

// Initial Run
changeLang('th', document.querySelector('.lang-btn.active'));
